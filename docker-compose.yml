name: daily-hub-nextjs

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      retries: 10

  web:
    build:
      context: .
      target: runner
    env_file: .env
    ports:
      - "3001:3000"
    depends_on:
      db:
        condition: service_healthy

  # Checks the radio stations every 15 seconds and announces song changes.
  listener:
    build:
      context: .
      target: listener
    env_file: .env
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
